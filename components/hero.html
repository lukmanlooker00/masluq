<section class="hero-section" aria-label="Sorotan Utama">
  <div class="hero-banner-container">
    <div class="hero-slides-track" id="hero-slides-track"></div>
    <button type="button" class="hero-slider-btn hero-prev" id="hero-prev-btn" aria-label="Slide sebelumnya"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
    <button type="button" class="hero-slider-btn hero-next" id="hero-next-btn" aria-label="Slide berikutnya"><i class="ph ph-caret-right" aria-hidden="true"></i></button>
    <div class="hero-dots" id="hero-dots"></div>
  </div>
  <div class="ticker-bar">
    <div class="container ticker-inner">
      <span class="ticker-label"><i class="ph ph-megaphone" aria-hidden="true"></i> Info</span>
      <div class="ticker-viewport">
        <div class="ticker-track" id="hero-ticker-track"></div>
      </div>
    </div>
  </div>
</section>
